services:
  api:
    build: .
    container_name: desafio-node-api
    ports:
      - "3333:3333"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: docker
      DB_NAME: desafio1_compasso
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: desafio-node-db
    environment:
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: desafio1_compasso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10
    volumes:
      - desafio-node-data:/var/lib/postgresql/data

volumes:
  desafio-node-data:
